version: 2.1

# This owner's fork is configured directly; no AI-generated upstream PR.
# Keep the is-a.dev registration tests and reserved ordering checks enabled.
jobs:
  verify-register:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install locked Node dependencies
          command: npm ci
      - run:
          name: Run registration tests
          command: npm test
      - run:
          name: Check reserved domain ordering
          command: npm run check:reserved-order
workflows:
  verify-register:
    jobs:
      - verify-register
